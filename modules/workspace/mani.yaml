tasks:
  context:
    desc: Locate local and inherited instructions, skills, and documentation
    cmd: |
      set -eu
      printf 'Directory: %s\n' "$PWD"
      printf 'Git root: %s\n' "$(git rev-parse --show-toplevel)"
      directory=$PWD
      while :; do
        if [ -f "$directory/AGENTS.md" ]; then
          printf 'Instructions: %s/AGENTS.md\n' "$directory"
        fi
        if [ -d "$directory/.agents/skills" ]; then
          printf 'Skills: %s/.agents/skills\n' "$directory"
        fi
        if [ "$directory" = / ]; then
          break
        fi
        directory=$(dirname "$directory")
      done
      if [ -f README.md ]; then
        printf 'Documentation: %s/README.md\n' "$PWD"
      fi
  status:
    desc: Query Git status within the selected directory without refreshing the index
    cmd: |
      set -eu
      printf 'Directory: %s\n' "$PWD"
      printf 'Git root: %s\n' "$(git rev-parse --show-toplevel)"
      GIT_OPTIONAL_LOCKS=0 git status --short --branch -- .
