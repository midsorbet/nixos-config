defaultThinkingLevel: xhigh
textVerbosity: low
power:
  sleepPrevention: system
steeringMode: all
followUpMode: all
exa:
  enabled: true
astGrep:
  enabled: true
bashInterceptor:
  enabled: true
browser:
  relay: true
computer:
  enabled: false
checkpoint:
  enabled: true
edit:
  enforceSeenLines: true
error:
  notify: on
display:
  showTokenUsage: true
  cacheMissMarker: true
generate_image:
  enabled: true
github:
  enabled: true
read:
  renderMarkdown: true
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: false
  minToolCalls: 12
mnemopi:
  scoping: per-project-tagged
modelRoles:
  default: openai-codex/gpt-5.6-sol:max
  smol: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-terra:max
  vision: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  designer: openai-codex/gpt-5.6-sol:high
  commit: openai-codex/gpt-5.6-luna:medium
  tiny: openai-codex/gpt-5.6-luna:low
  task: openai-codex/gpt-5.6-sol:medium
  advisor: anthropic/claude-opus-5:high
modelProviderOrder:
  - anthropic
  - zai
  - openai-codex
  - cloudflare-ai-gateway
  - google-antigravity
  - opencode-zen
advisor:
  enabled: true
  syncBacklog: off
  immuneTurns: 5
prewalk:
  enabled: false
tier:
  openai: priority
  subagent: default
task:
  eager: default
  prewalk: true
  enableEffort: true
  maxEffort: high
  maxConcurrency: 12
  maxRecursionDepth: 2
  softRequestBudgetNotice: true
  showResolvedModelBadge: true
  agentAdvisor:
    task: on
secrets:
  enabled: true
skills:
  ignoredSkills:
    - chronicle
    - define-goal
    - jupyter-notebook
    - pdf
    - playwright
    - playwright-interactive
    - screenshot
    - security-best-practices
    - security-ownership-map
    - security-threat-model
startup:
  setupWizard: false
statusLine:
  preset: custom
  transparent: true
  compactThinkingLevel: true
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    # The status line follows the active provider; /usage shows primary and advisor quotas.
    - usage
    - session_name
terminal:
  showProgress: true
tui:
  codexResetFireworks: true
symbolPreset: nerd
theme:
  dark: kanagawa-wave
  light: everforest-light-hard
