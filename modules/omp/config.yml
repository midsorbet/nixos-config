defaultThinkingLevel: xhigh
textVerbosity: low
exa:
  enabled: true
astGrep:
  enabled: true
browser:
  relay: true
computer:
  enabled: false
edit:
  enforceSeenLines: true
error:
  notify: on
generate_image:
  enabled: true
read:
  renderMarkdown: true
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: false
  minToolCalls: 12
mnemopi:
  scoping: per-project-tagged
modelRoles:
  default: openai-codex/gpt-5.6-sol:max
  smol: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-terra:max
  vision: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  designer: openai-codex/gpt-5.6-sol:high
  commit: openai-codex/gpt-5.6-luna:medium
  tiny: openai-codex/gpt-5.6-luna:low
  task: openai-codex/gpt-5.6-luna:medium
  advisor: anthropic/claude-fable-5:high
modelProviderOrder:
  - anthropic
  - zai
  - openai-codex
  - cloudflare-ai-gateway
  - google-antigravity
  - opencode-zen
advisor:
  enabled: true
  syncBacklog: off
  immuneTurns: 5
tier:
  openai: priority
  subagent: default
task:
  eager: default
  prewalk: true
  enableEffort: true
  maxEffort: high
  maxConcurrency: 8
  maxRecursionDepth: 2
  softRequestBudgetNotice: true
  agentAdvisor:
    task: on
secrets:
  enabled: true
skills:
  ignoredSkills:
    - chronicle
    - define-goal
    - jupyter-notebook
    - pdf
    - playwright
    - playwright-interactive
    - screenshot
    - security-best-practices
    - security-ownership-map
    - security-threat-model
startup:
  setupWizard: false
tui:
  codexResetFireworks: true
symbolPreset: nerd
theme:
  dark: kanagawa-wave
  light: everforest-light-hard
