defaultThinkingLevel: xhigh
textVerbosity: medium
enabledProviders:
  - codex
power:
  sleepPrevention: system
steeringMode: all
followUpMode: all
exa:
  enabled: true
astGrep:
  enabled: true
bashInterceptor:
  enabled: true
bash:
  # Deny common standalone terminal launches; use the console TTY or Herdr.
  patterns:
    - match: "open *Ghostty*"
      approval: deny
    - match: "open *ghostty.app*"
      approval: deny
    - match: "open *com.mitchellh.ghostty*"
      approval: deny
    - match: "open *Terminal*"
      approval: deny
    - match: "open *iTerm*"
      approval: deny
    - match: "*/open *Ghostty*"
      approval: deny
    - match: "*/open *ghostty.app*"
      approval: deny
    - match: "*/open *com.mitchellh.ghostty*"
      approval: deny
    - match: "*/open *Terminal*"
      approval: deny
    - match: "*/open *iTerm*"
      approval: deny
    - match: "*ghostty *-e *"
      approval: deny
    - match: "*ghostty *--command*"
      approval: deny
    - match: "*ghostty +new-window*"
      approval: deny
  autoBackground:
    enabled: true
    thresholdMs: 60000
browser:
  relay: true
computer:
  enabled: false
checkpoint:
  enabled: true
edit:
  enforceSeenLines: true
error:
  notify: on
display:
  showTokenUsage: true
  cacheMissMarker: true
composer:
  shape: band
  tokenRate: true
generate_image:
  enabled: true
github:
  enabled: true
read:
  renderMarkdown: true
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: false
  minToolCalls: 12
mnemopi:
  # Reviewed context only; older automatic banks remain recovery history.
  dbPath: "@OMP_USER_HOME@/.omp/agent/memories/mnemopi-reviewed-20260905/mnemopi.db"
  bank: reviewed-20260905
  scoping: per-project-tagged
  autoRecall: true
  autoRetain: false
providers:
  openai-codex:
    codeMode: auto
modelRoles:
  default: anthropic/claude-opus-5-5:high
  smol: openai-codex/gpt-6-luna:high
  slow: openai-codex/gpt-6-sol:max
  vision: openai-codex/gpt-6-sol:high
  plan: anthropic/claude-fable-5-1:xhigh
  commit: openai-codex/gpt-6-luna:low
  tiny: openai-codex/gpt-6-luna:low
  task: openai-codex/gpt-6-luna:max
  advisor: openai-codex/gpt-6-astra:high
  judge: typesafe/jev-latest
modelProviderOrder:
  - anthropic
  - zai
  - openai-codex
  - opencode-zen
advisor:
  enabled: false
  syncBacklog: off
  immuneTurns: 5
prewalk:
  enabled: false
tier:
  openai: default
  subagent: default
task:
  eager: default
  prewalk: true
  enableEffort: true
  maxEffort: high
  maxConcurrency: 12
  maxRecursionDepth: 2
  softRequestBudgetNotice: true
  showResolvedModelBadge: true
  agentAdvisor:
    task: off
secrets:
  enabled: true
skills:
  ignoredSkills:
    - chronicle
    - define-goal
    - jupyter-notebook
    - pdf
    - playwright
    - playwright-interactive
    - screenshot
    - security-best-practices
    - security-ownership-map
    - security-threat-model
startup:
  setupWizard: false
statusLine:
  preset: custom
  compactThinkingLevel: true
  showHookStatus: false
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - status
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    # The status line follows the active provider; /usage shows primary and advisor quotas.
    - usage
    - session_name
terminal:
  showProgress: true
tools:
  xdevDocs: builtins
tui:
  codexResetFireworks: true
  vimMode: false
symbolPreset: nerd
theme:
  dark: kanagawa-wave
  light: everforest-light-hard
