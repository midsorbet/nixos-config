#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "<Right>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin jump-to-char"
desc = "Jump to a file by its first character"

[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Change permissions on selected files"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on   = "<C-p>"
for  = "macos"
run  = "shell -- qlmanage -p %s"
desc = "Preview selected files with Quick Look"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to the current Git repository root"

[[mgr.prepend_keymap]]
on   = [ "g", "v" ]
run  = "cd ~/vault"
desc = "Go to the vault"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/vault/projects"
desc = "Go to projects"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "cd ~/vault/projects/nixos-config"
desc = "Go to the Nix configuration"

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"
