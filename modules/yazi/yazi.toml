#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
sort_by        = "natural"
sort_sensitive = false
sort_dir_first = true
show_hidden    = true
linemode       = "size"
show_symlink   = true

[preview]
max_width     = 1200
max_height    = 1200
image_quality = 90

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
