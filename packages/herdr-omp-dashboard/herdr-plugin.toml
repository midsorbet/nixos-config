id = "local.omp-dashboard"
name = "OMP Dashboard"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Launch OMP agents and open the remote dashboard"
platforms = ["macos"]

[[actions]]
id = "open-dashboard"
title = "Open OMP dashboard"
description = "Open the OMP remote dashboard in the default browser"
contexts = ["global"]
command = ["/usr/bin/open", "https://omp.midsorbet.me"]

[[panes]]
id = "agent"
title = "New OMP agent"
description = "Launch OMP in the vault"
placement = "tab"
command = ["@ompCommand@"]
cwd = "@vaultRoot@"
