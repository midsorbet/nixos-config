# Conservative PowerToys DSC v3 settings for the work laptop.
# Values follow the serialized PowerToys 0.101 settings models used by DSC v3.
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor: dscv3
resources:
  - name: Configure PowerToys app shell
    type: Microsoft.PowerToys/AppSettings
    properties:
      settings:
        properties:
          enabled:
            AlwaysOnTop: true
            AltWindowCycle: true
            CmdPal: true
            ColorPicker: true
            FancyZones: true
            "Keyboard Manager": false
            "PowerToys Run": false
            PowerRename: true
            "Shortcut Guide": true
            Workspaces: true
          startup: true
          theme: dark
        name: App
        version: 1.0

  - name: Configure FancyZones window management
    type: Microsoft.PowerToys/FancyZonesSettings
    properties:
      settings:
        properties:
          fancyzones_shiftDrag:
            value: true
          fancyzones_mouseSwitch:
            value: false
          fancyzones_overrideSnapHotkeys:
            value: true
          fancyzones_moveWindowAcrossMonitors:
            value: true
          fancyzones_displayOrWorkAreaChange_moveWindows:
            value: true
          fancyzones_zoneSetChange_moveWindows:
            value: true
          fancyzones_appLastZone_moveWindows:
            value: true
          fancyzones_openWindowOnActiveMonitor:
            value: true
          fancyzones_span_zones_across_monitors:
            value: false
          fancyzones_monitorRotation:
            value: true
          fancyzones_monitorRotation_hotkey:
            value:
              win: false
              ctrl: false
              alt: true
              shift: false
              code: 88
              key: X
        name: FancyZones
        version: 1.0

  - name: Configure Always On Top
    type: Microsoft.PowerToys/AlwaysOnTopSettings
    properties:
      settings:
        properties:
          frame-enabled:
            value: true
          frame-accent-color:
            value: true
          frame-thickness:
            value: 4
          sound-enabled:
            value: false
          do-not-activate-on-game-mode:
            value: true
          round-corners-enabled:
            value: true
        name: AlwaysOnTop
        version: 1.0

  - name: Configure Workspaces
    type: Microsoft.PowerToys/WorkspacesSettings
    properties:
      settings:
        properties:
          hotkey:
            value:
              win: true
              ctrl: false
              alt: false
              shift: true
              code: 186
              key: ";"
        name: Workspaces
        version: 1.0

  - name: Configure Shortcut Guide
    type: Microsoft.PowerToys/ShortcutGuideSettings
    properties:
      settings:
        properties:
          open_shortcutguide:
            win: true
            ctrl: false
            alt: false
            shift: true
            code: 191
            key: "/"
          win_key_action:
            value: 2
          press_time:
            value: 900
          close_on_windows_key_release:
            value: true
          theme:
            value: system
        name: ShortcutGuide
        version: 1.0

  - name: Configure Color Picker
    type: Microsoft.PowerToys/ColorPickerSettings
    properties:
      settings:
        properties:
          changecursor:
            value: true
          copiedcolorrepresentation: HEX
        name: ColorPicker
        version: 1.0
